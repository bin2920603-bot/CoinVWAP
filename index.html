<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VWAP 돌파 · OKX 선물</title>
<style>
  body{margin:0;background:#0E141B;color:#C9D6E2;font:13px system-ui,"Malgun Gothic",sans-serif}
  header{position:sticky;top:0;z-index:5;background:#0E141B;padding:12px;border-bottom:1px solid #22303E}
  h1{margin:0 0 6px;font-size:15px}
  h1 span{color:#D6B15E}
  #st{color:#6E8195;font-size:12px;margin-bottom:8px}
  button,select,input#q{background:#131C26;color:#C9D6E2;border:1px solid #22303E;border-radius:4px;padding:6px 10px;font:inherit}
  input#q{width:130px;margin-left:6px}
  label{margin-left:10px;font-size:12px;color:#6E8195}
  .wrap{overflow:auto}
  table{border-collapse:separate;border-spacing:0;white-space:nowrap}
  th,td{padding:0 9px;height:36px;border-bottom:1px solid #1A2530;text-align:center}
  th{position:sticky;top:0;background:#131C26;color:#6E8195;font-weight:500;font-size:11px;z-index:2}
  td.coin,th.coin{position:sticky;left:0;background:#0E141B;text-align:left;border-right:1px solid #22303E;z-index:3}
  th.coin{background:#131C26;z-index:4}
  td.coin a{color:#C9D6E2;text-decoration:none}
  .up{color:#F2606C}.down{color:#4D92F0}
  .c0{background:rgba(242,96,108,.28);color:#F2606C;font-weight:700}
  .c1{background:rgba(240,150,60,.22);color:#F0963C;font-weight:600}
  .c2{background:rgba(232,193,90,.16);color:#E8C15A}
  .dim{color:#2C3A48}
  .gap{color:#3A4A5A}
  .gap2{color:#6E8195}
  /* 전고점: 3일=주황, 20일=보라, 120일=빨강. 3% 이내로 막 넘었으면 더 진하게 */
  .h3{background:rgba(240,150,60,.14);color:#F0963C}
  .h3.f{background:rgba(240,150,60,.32);font-weight:700}
  .h20{background:rgba(181,140,255,.14);color:#B58CFF}
  .h20.f{background:rgba(181,140,255,.32);font-weight:700}
  .h120{background:rgba(242,96,108,.14);color:#F2606C}
  .h120.f{background:rgba(242,96,108,.32);font-weight:700}
  .t3{background:rgba(242,96,108,.28);color:#F2606C;font-weight:700}
  .t2{background:rgba(240,150,60,.22);color:#F0963C;font-weight:600}
  .empty{padding:30px 16px;color:#6E8195;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>VWAP 돌파 · 전고점 돌파 <span>OKX 선물</span></h1>
  <div id="st">준비 중</div>
  <button id="go">직접 다시 검사</button>
  <select id="sort">
    <option value="tvx">정렬: 1분 거래대금 증가 배수순</option>
    <option value="mix">정렬: 돌파 많은 순</option>
    <option value="fresh">정렬: 방금 넘은 순</option>
    <option value="chg">정렬: 24시간 상승률순</option>
  </select>
  <input id="q" type="text" placeholder="코인 검색 (예: MON)" autocomplete="off" autocapitalize="characters">
  <label><input type="checkbox" id="all"> 돌파 없는 코인도 보기</label>
</header>
<div class="wrap" id="out"><div class="empty">불러오는 중...</div></div>

<script>
// 설정: 거래대금 상위 TOP개 코인, 최근 N개 봉으로 VWAP 계산, LOOK봉 전까지의 돌파를 "금방"으로 본다
const TF = [["5m","5분"],["15m","15분"],["1H","1시간"],["1D","일"],["1W","주"],["1M","월"]];
const HI = [["h3d","3일",""],["h20d","20일",""],["h120d","120일",""]];  // 전고점: 키, 이름
const HCLS = {h3d:"h3", h20d:"h20", h120d:"h120"};
const TOP = 300, N = 100, MINB = 20, LOOK = 2;
const FRESH = 3;        // 고점을 이 %(퍼센트) 이내로 넘었으면 "방금 넘음"으로 진하게 표시
const STALE_MIN = 40;   // 서버 결과가 이 분(分)보다 오래되면 화면에서 직접 검사
let cs = [], busy = false, doneAt = "", priceAt = "", source = "";

const sleep = ms => new Promise(r => setTimeout(r, ms));
const st = t => document.getElementById("st").textContent = t;
const hm = d => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");

async function jget(url) {
  for (let t = 0; t < 3; t++) {
    try {
      const r = await fetch(url);
      if (r.status === 429) { await sleep(1500); continue; }
      const j = await r.json();
      if (j.code !== "0") { await sleep(800); continue; }
      return j.data;
    } catch (e) { await sleep(500); }
  }
  return null;
}

function vwapAt(b, i) {
  let pv = 0, v = 0;
  for (let k = Math.max(0, i - N + 1); k <= i; k++) {
    pv += (b[k].h + b[k].l + b[k].c) / 3 * b[k].v;
    v += b[k].v;
  }
  return v > 0 ? pv / v : null;
}

function check(b) {
  const L = b.length - 1;
  if (L < MINB + LOOK + 1) return null;
  const vN = vwapAt(b, L);
  if (vN == null) return null;
  if (!(b[L].c > vN)) return {above: false, k: null};
  for (let k = 0; k <= LOOK; k++) {
    const i = L - k;
    const vi = vwapAt(b, i), vp = vwapAt(b, i - 1);
    if (vi == null || vp == null) break;
    if (b[i].c > vi && b[i - 1].c <= vp) return {above: true, k: k};
  }
  return {above: true, k: null};
}

// 전고점 가격(h3d, h20d, h120d)을 계산한다. d: OKX 원본 봉(최신이 맨 앞)
function extra(bar, d) {
  try {
    if (bar === "1H" || bar === "1D") {
      const prior = d.slice().reverse().map(x => +x[2]).slice(0, -1);  // 진행 중인 봉은 뺀다
      if (bar === "1H") {
        const p = prior.slice(-72);  // 3일
        if (p.length >= 24) return {h3d: Math.max(...p)};
      } else if (prior.length >= 10) {
        const o = {h20d: Math.max(...prior.slice(-20))};
        if (prior.length >= 30) o.h120d = Math.max(...prior.slice(-120));
        return o;
      }
    }
  } catch (e) {}
  return {};
}

// 1순위: 서버가 계산해 둔 결과 읽기 (바로 보임)
async function loadServer() {
  try {
    const r = await fetch("data/vwap.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return false;
    const j = await r.json();
    const t = new Date(j.updated_at);
    const age = (Date.now() - t.getTime()) / 60000;
    if (!j.coins || !j.coins.length || age > STALE_MIN) return false;
    cs = j.coins;
    doneAt = hm(t);
    source = "서버 결과";
    return true;
  } catch (e) { return false; }
}

// 2순위: 화면에서 직접 검사 (서버 결과가 없거나 오래됐을 때). 이 경우 1분 거래대금 칸은 비어 있다.
async function scanLocal() {
  st("코인 목록 받는 중...");
  const tk = await jget("https://www.okx.com/api/v5/market/tickers?instType=SWAP");
  if (!tk) return false;
  const list = tk.filter(t => t.instId.endsWith("-USDT-SWAP"))
    .map(t => ({
      sym: t.instId.split("-")[0], id: t.instId,
      vol: (+t.volCcy24h) * (+t.last),
      chg: (+t.last / +t.open24h - 1) * 100, last: +t.last, res: {}
    }))
    .filter(x => x.vol > 0)
    .sort((a, b) => b.vol - a.vol)
    .slice(0, TOP);

  const jobs = [];
  list.forEach(c => TF.forEach(([bar]) => jobs.push([c, bar])));
  let idx = 0, done = 0;
  async function worker() {
    while (idx < jobs.length) {
      const [c, bar] = jobs[idx++];
      const lim = bar === "1D" ? 121 : 120;
      const d = await jget("https://www.okx.com/api/v5/market/candles?instId=" + c.id + "&bar=" + bar + "&limit=" + lim);
      if (d) {
        const b = d.slice().reverse().map(x => ({h: +x[2], l: +x[3], c: +x[4], v: +x[5]}));
        c.res[bar] = check(b);
        Object.assign(c, extra(bar, d));
      }
      done++;
      if (done % 20 === 0) st("직접 검사 중... " + Math.round(done / jobs.length * 100) + "%");
      await sleep(250);
    }
  }
  await Promise.all([1, 2, 3, 4].map(worker));
  cs = list;
  doneAt = hm(new Date());
  source = "화면에서 직접 검사";
  return true;
}

// 1분마다: 코인 전체 현재가를 한 번에 받아서 전고점과 비교한다 (OKX에 한 번만 물어봄)
async function refreshPrices() {
  if (busy || !cs.length) return;
  const tk = await jget("https://www.okx.com/api/v5/market/tickers?instType=SWAP");
  if (!tk || busy) return;
  const m = {};
  tk.forEach(t => { if (t.instId.endsWith("-USDT-SWAP")) m[t.instId.split("-")[0]] = t; });
  cs.forEach(c => {
    const t = m[c.sym];
    if (!t) return;
    const l = +t.last, o = +t.open24h;
    if (l > 0) { c.last = l; if (o > 0) c.chg = (l / o - 1) * 100; }
  });
  priceAt = hm(new Date());
  render();
}

async function refresh(force) {
  if (busy) return;
  busy = true;
  document.getElementById("go").disabled = true;
  let ok = false;
  if (!force) ok = await loadServer();
  if (!ok) ok = await scanLocal();
  if (ok) render();
  else st("OKX/서버에서 데이터를 못 받았어요. 잠시 뒤 다시 눌러주세요");
  busy = false;
  document.getElementById("go").disabled = false;
  if (ok) refreshPrices();
}

function fmtP(p) {
  if (!(p > 0)) return "–";
  if (p >= 1000) return p.toFixed(1);
  if (p >= 100) return p.toFixed(2);
  if (p >= 1) return p.toFixed(4);
  return p.toPrecision(4);
}
function fmtV(v) {
  if (v == null) return "–";
  if (v >= 1e8) return (v / 1e8).toFixed(1) + "억";
  if (v >= 1e4) return Math.round(v / 1e4) + "만";
  return String(Math.round(v));
}

// 현재가가 각 전고점을 몇 % 넘었는지 계산 (못 넘었으면 마이너스)
function hiGaps(c) {
  const o = {};
  HI.forEach(([key]) => {
    o[key] = (c[key] > 0 && c.last > 0) ? (c.last / c[key] - 1) * 100 : null;
  });
  return o;
}

function render() {
  const all = document.getElementById("all").checked;
  const sortBy = document.getElementById("sort").value;
  const q = document.getElementById("q").value.trim().toUpperCase();
  let r = cs.map(c => {
    let best = 9, n = 0;
    TF.forEach(([bar]) => {
      const x = c.res[bar];
      if (x && x.k != null) { n++; best = Math.min(best, x.k); }
    });
    const gaps = hiGaps(c);
    let nh = 0, fresh = 1e9;
    HI.forEach(([key]) => {
      const g = gaps[key];
      if (g != null && g > 0) { nh++; fresh = Math.min(fresh, g); }
    });
    return {c: c, best: best, n: n, gaps: gaps, nh: nh, fresh: fresh};
  });
  const hitV = r.filter(x => x.n > 0).length;
  const hitH = r.filter(x => x.nh > 0).length;
  if (q) r = r.filter(x => x.c.sym.toUpperCase().includes(q));   // 검색 중이면 돌파 없는 코인도 보여준다
  else if (!all) r = r.filter(x => x.n > 0 || x.nh > 0);
  if (sortBy === "fresh") r.sort((a, b) => a.fresh - b.fresh || b.c.vol - a.c.vol);
  else if (sortBy === "tvx") r.sort((a, b) => (b.c.tv1x == null ? -1 : b.c.tv1x) - (a.c.tv1x == null ? -1 : a.c.tv1x));
  else if (sortBy === "chg") r.sort((a, b) => b.c.chg - a.c.chg);
  else r.sort((a, b) => (b.n + b.nh) - (a.n + a.nh) || a.best - b.best || b.c.vol - a.c.vol);

  st(source + " " + doneAt + " · 상위 " + cs.length + "종목 중 VWAP 돌파 " + hitV + " · 전고점 돌파 " + hitH + (priceAt ? " · 현재가 " + priceAt : ""));
  const out = document.getElementById("out");
  if (!r.length) {
    out.innerHTML = q
      ? '<div class="empty">"' + q + '" 코인이 이 표에 없어요.<br>이 표는 1분 거래대금이 늘어난 상위 ' + cs.length + '개만 보여줘요.</div>'
      : '<div class="empty">지금 막 VWAP이나 전고점을 뚫은 코인이 없어요.</div>';
    return;
  }
  let h = '<table><thead><tr><th class="coin">코인</th><th>현재가</th><th>24시간</th>';
  HI.forEach(([key, name]) => h += "<th>" + name + " 고점</th>");
  h += "<th>1분 전</th><th>2분 전</th><th>3분 전</th><th>4분 전</th><th>5분 전</th><th>1분 배수</th>";
  TF.forEach(([bar, name]) => h += "<th>VWAP " + name + "</th>");
  h += "</tr></thead><tbody>";
  r.forEach(({c, gaps}) => {
    const url = "https://www.okx.com/trade-swap/" + c.sym.toLowerCase() + "-usdt-swap";
    const cls = c.chg > 0 ? "up" : c.chg < 0 ? "down" : "";
    h += '<tr><td class="coin"><a href="' + url + '" target="_blank" rel="noopener">' + c.sym + "</a></td>";
    h += "<td>" + fmtP(c.last) + "</td>";
    h += '<td class="' + cls + '">' + (c.chg > 0 ? "+" : "") + c.chg.toFixed(1) + "%</td>";
    HI.forEach(([key]) => {
      const g = gaps[key];
      if (g == null) h += '<td class="dim">–</td>';
      else if (g > 0) h += '<td class="' + HCLS[key] + (g <= FRESH ? " f" : "") + '">▲ +' + g.toFixed(1) + "%</td>";
      else h += '<td class="gap">' + g.toFixed(1) + "%</td>";
    });
    // 1분 거래대금 5칸: 직전(오른쪽) 분보다 늘었으면 빨강, 줄었으면 파랑
    const v = c.tv1s || [];
    for (let i = 0; i < 5; i++) {
      const a = v[i], p = v[i + 1];
      const k = (a == null || p == null || a === p) ? "" : a > p ? "up" : "down";
      h += '<td class="' + k + '">' + fmtV(a) + "</td>";
    }
    const x = c.tv1x;
    h += x == null ? '<td class="dim">–</td>'
      : '<td class="' + (x >= 3 ? "t3" : x >= 2 ? "t2" : "") + '">' + x.toFixed(1) + "배</td>";
    TF.forEach(([bar]) => {
      const y = c.res[bar];
      if (!y) h += '<td class="dim">–</td>';
      else if (y.k === 0) h += '<td class="c0">▲ 지금</td>';
      else if (y.k === 1) h += '<td class="c1">▲ 1봉전</td>';
      else if (y.k === 2) h += '<td class="c2">▲ 2봉전</td>';
      else h += '<td class="dim">' + (y.above ? "위" : "아래") + "</td>";
    });
    h += "</tr>";
  });
  h += "</tbody></table>";
  const top = out.scrollTop, left = out.scrollLeft;
  out.innerHTML = h;
  out.scrollTop = top; out.scrollLeft = left;
}

document.getElementById("go").addEventListener("click", () => refresh(true));
document.getElementById("all").addEventListener("change", () => { if (cs.length) render(); });
document.getElementById("sort").addEventListener("change", () => { if (cs.length) render(); });
document.getElementById("q").addEventListener("input", () => { if (cs.length) render(); });
refresh(false);
setInterval(() => refresh(false), 120000);   // 서버 결과 다시 읽기
setInterval(refreshPrices, 60000);            // 현재가 1분마다
</script>
</body>
</html>
