name: vwap

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vwap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 시간 확인
        id: t
        run: |
          m=$(TZ=Asia/Seoul date +%M)
          if [ $((10#$m % 15)) -lt 3 ]; then echo "tf=1" >> $GITHUB_OUTPUT; else echo "tf=0" >> $GITHUB_OUTPUT; fi
      - run: python vwap.py
      - name: 200선
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ema200.py
      - name: 타점 계산
        if: steps.t.outputs.tf == '1'
        run: python setup_tf.py
      - name: 알림
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify_vwap.py || true
          python notify_white.py || true
          python vwap1m.py || true
          if [ "${{ steps.t.outputs.tf }}" = "1" ]; then python notify_tf.py; fi
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "vwap: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git pull --rebase --autostash
          git push
