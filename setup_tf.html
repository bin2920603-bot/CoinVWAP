<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타점 후보 · 여러 봉 · OKX 선물</title>
<style>
  body{margin:0;background:#0E141B;color:#C9D6E2;font:13px system-ui,"Malgun Gothic",sans-serif}
  header{position:sticky;top:0;z-index:5;background:#0E141B;padding:12px;border-bottom:1px solid #22303E}
  h1{margin:0 0 6px;font-size:15px}
  h1 span{color:#D6B15E}
  #st{color:#6E8195;font-size:12px;margin-bottom:8px}
  .row{margin-bottom:6px}
  button{background:#131C26;color:#C9D6E2;border:1px solid #22303E;border-radius:4px;padding:7px 11px;font:inherit;margin:0 6px 6px 0}
  button.on{background:#D6B15E;color:#0E141B;font-weight:700}
  label{font-size:12px;color:#6E8195;margin-left:4px}
  select,input[type=search]{background:#131C26;color:#C9D6E2;border:1px solid #22303E;border-radius:4px;padding:7px 9px;font:inherit;margin:0 6px 6px 0}
  input[type=search]{width:150px}
  .note{padding:10px 12px;color:#6E8195;font-size:12px;line-height:1.6}
  .wrap{overflow:auto}
  table{border-collapse:separate;border-spacing:0;white-space:nowrap}
  th,td{padding:0 10px;height:36px;border-bottom:1px solid #1A2530;text-align:center}
  th{position:sticky;top:0;background:#131C26;color:#6E8195;font-weight:500;font-size:11px;z-index:2}
  td.coin,th.coin{position:sticky;left:0;background:#0E141B;text-align:left;border-right:1px solid #22303E;z-index:3}
  th.coin{background:#131C26;z-index:4}
  td.coin a{color:#C9D6E2;text-decoration:none}
  .tag{font-size:9px;color:#0E141B;background:#6E8195;border-radius:3px;padding:1px 4px;margin-left:5px}
  .up{color:#F2606C}.down{color:#4D92F0}.gold{color:#D6B15E}
  .empty{padding:30px 16px;color:#6E8195;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>타점 후보 <span>OKX 선물 · 여러 봉</span></h1>
  <div id="st">불러오는 중...</div>
  <div class="row" id="tfs"></div>
  <div class="row">
    <button id="b1" class="on">뚫기 직전</button><button id="b2">뚫은 직후</button>
    <input type="checkbox" id="stk"><label for="stk">주식·지수·금도 보기</label>
  </div>
  <div class="row">
    <select id="spr">
      <option value="0.3">선폭 0.3배 이하</option>
      <option value="0.5" selected>선폭 0.5배 이하</option>
      <option value="1">선폭 1배 이하</option>
      <option value="99">선폭 전체</option>
    </select>
    <input type="search" id="q" placeholder="코인 검색 (예: MEGA)">
  </div>
</header>
<div class="note" id="note"></div>
<div class="wrap" id="out"></div>

<script>
const NAMES = {"15m": "15분", "1H": "1시간", "4H": "4시간", "1D": "일봉"};
const NOTE = {
  squeeze: "선(EMA20·50, VWAP100)이 좁게 모여 있고 가격이 그 근처에 붙어 있는, 아직 안 뚫은 코인이에요. 선폭은 '평소 캔들 크기의 몇 배'예요. 작을수록 선이 많이 모인 거예요. EMA200까지는 위로 남은 거리예요.",
  breakout: "지금이나 한 봉 전에, 큰 양봉이 선(EMA7·20·50·200, VWAP100)을 한 번에 넘은 코인이에요. 몸통은 평소 양봉의 몇 배인지예요."
};
let data = null, bar = "1H", tab = "squeeze";
const f = (v, d) => (v > 0 ? "+" : "") + v.toFixed(d == null ? 1 : d) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const showStock = () => document.getElementById("stk").checked;
const maxSpread = () => +document.getElementById("spr").value;
const pickS = rows => (showStock() ? rows : rows.filter(r => !r.stock)).filter(r => r.spread_x <= maxSpread());
const pickB = rows => showStock() ? rows : rows.filter(r => !r.stock);

async function load() {
  try {
    const r = await fetch("data/setup_tf.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw 0;
    data = await r.json();
  } catch (e) {
    document.getElementById("st").textContent = "결과 파일이 아직 없어요";
    document.getElementById("out").innerHTML = '<div class="empty">GitHub의 Actions에서 setup_tf를 한 번 실행해 주세요.</div>';
    return;
  }
  if (!data.tfs[bar]) bar = data.bars[0];
  render();
}

function render() {
  const t = new Date(data.updated_at);
  const min = Math.round((Date.now() - t.getTime()) / 60000);
  document.getElementById("st").textContent =
    "상위 " + data.checked + "종목 검사 · " + min + "분 전 결과" + (min > 60 ? " (오래됨)" : "");

  let bh = "";
  data.bars.forEach(b => {
    const x = data.tfs[b];
    bh += '<button data-bar="' + b + '" class="' + (b === bar ? "on" : "") + '">' + NAMES[b] +
      " " + pickS(x.squeeze).length + "/" + pickB(x.breakout).length + "</button>";
  });
  document.getElementById("tfs").innerHTML = bh;
  document.querySelectorAll("#tfs button").forEach(el => {
    el.onclick = () => { bar = el.getAttribute("data-bar"); render(); };
  });

  document.getElementById("b1").className = tab === "squeeze" ? "on" : "";
  document.getElementById("b2").className = tab === "breakout" ? "on" : "";
  document.getElementById("note").textContent = "버튼 숫자 = 뚫기 직전 / 뚫은 직후 개수. " + NOTE[tab];

  const q = document.getElementById("q").value.trim().toLowerCase();
  let rows = tab === "squeeze" ? pickS(data.tfs[bar].squeeze) : pickB(data.tfs[bar].breakout);
  if (q) rows = (showStock() ? data.tfs[bar][tab] : data.tfs[bar][tab].filter(r => !r.stock)).filter(r => r.sym.toLowerCase().includes(q));
  if (!rows.length) {
    document.getElementById("out").innerHTML = '<div class="empty">' + NAMES[bar] + '봉에서 조건에 맞는 코인이 지금은 없어요.</div>';
    return;
  }
  let h = '<table><thead><tr><th class="coin">코인</th><th>24시간</th>';
  h += tab === "squeeze"
    ? "<th>선폭</th><th>선과거리</th><th>변동비</th><th>EMA200까지</th>"
    : "<th>시점</th><th>양봉</th><th>몸통</th><th>거래량</th><th>넘은선</th>";
  h += "</tr></thead><tbody>";
  rows.forEach(c => {
    const url = "https://www.okx.com/trade-swap/" + c.sym.toLowerCase() + "-usdt-swap";
    h += '<tr><td class="coin"><a href="' + url + '" target="_blank" rel="noopener">' + c.sym + "</a>" +
      (c.stock ? '<span class="tag">주식</span>' : "") + "</td>";
    h += '<td class="' + cls(c.chg) + '">' + f(c.chg) + "</td>";
    if (tab === "squeeze") {
      h += "<td>" + c.spread_x.toFixed(2) + "배</td><td>" + f(c.near, 2) + "</td><td>" + c.contr + "배</td>";
      h += '<td class="gold">' + f(c.to200) + "</td>";
    } else {
      h += "<td>" + (c.k === 0 ? "지금" : "1봉전") + '</td><td class="up">' + f(c.gain) + "</td>";
      h += "<td>" + c.body_x + "배</td><td>" + (c.vol_x == null ? "–" : c.vol_x + "배") + "</td><td>" + c.crossed + "개</td>";
    }
    h += "</tr>";
  });
  document.getElementById("out").innerHTML = h + "</tbody></table>";
}

document.getElementById("b1").onclick = () => { tab = "squeeze"; if (data) render(); };
document.getElementById("b2").onclick = () => { tab = "breakout"; if (data) render(); };
document.getElementById("stk").onchange = () => { if (data) render(); };
document.getElementById("spr").onchange = () => { if (data) render(); };
document.getElementById("q").oninput = () => { if (data) render(); };
load();
setInterval(load, 120000);
</script>
</body>
</html>
